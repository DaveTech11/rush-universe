services:
  - type: web
    name: rush-universe
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: HOST
        value: 0.0.0.0
    disk:
      name: rush-data
      mountPath: /var/data
      sizeGB: 1
